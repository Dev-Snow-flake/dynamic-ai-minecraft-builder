gateway:
  uri: "wss://map.work-plus.kr/bridge"
  enrollment-uri: "https://map.work-plus.kr/api/v1/public/servers/enroll"
  auto-enroll: true
  # 수동/사설 배포에서만 사용하세요. 공개 서비스는 빈 값 그대로 두면 서버별 자격 증명을 자동 발급합니다.
  shared-secret: ""
  reconnect-delay-ticks: 100

server-id: ""
display-name: "Minecraft Server"

map:
  # 실제로 로드된 청크만 읽으며, 청크를 강제로 불러오지 않습니다.
  radius: 96
  step: 4

policy:
  # 안전을 위해 새 설치에서는 실제 월드 쓰기가 꺼져 있습니다.
  # 아래 allowed-regions를 서버에 맞게 수정한 뒤 true로 바꾸세요.
  allow-world-writes: false
  allowed-worlds:
    - "world"
  allowed-regions: []
  # 예시:
  # allowed-regions:
  #   - world: "world"
  #     min: { x: -128, y: -64, z: -128 }
  #     max-exclusive: { x: 128, y: 320, z: 128 }
  allowed-blocks:
    - "minecraft:spruce_planks"
    - "minecraft:stone_bricks"
    - "minecraft:glass"
    - "minecraft:oxidized_copper"
  minimum-tps: 18.0
  maximum-mspt: 40.0
  maximum-total-blocks: 12000
  maximum-batch-blocks: 250
  player-exclusion-radius: 24
